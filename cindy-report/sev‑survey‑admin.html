<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Survey Admin｜调研&邮件发送管理</title>
  <style>
    * {margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif;}
    body{background:#f3f4f6;padding:28px 16px;}
    .wrap{max-width:1200px;margin:0 auto;}
    h1{font-size:22px;color:#111827;margin-bottom:6px;}
    .sub-h{color:#6b7280;margin-bottom:20px;}
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px;}
    .panel{background:#fff;padding:20px;border-radius:12px;box-shadow:0 1px 8px #0000000a;}
    h3{margin-bottom:14px;font-size:17px;color:#1f2937;}
    .input-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
    input{padding:8px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:14px;}
    button{padding:8px 14px;border-radius:6px;border:none;font-size:14px;cursor:pointer;}
    .btn-blue{background:#2563eb;color:#fff;}
    .btn-red{background:#dc2626;color:#fff;}
    .btn-green{background:#059669;color:#fff;}
    .customer-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #eee;}
    .code-block{width:100%;min-height:220px;padding:12px;background:#111827;color:#a5f3fc;border-radius:8px;font-size:12px;overflow:auto;white-space:pre-wrap;}
    .bar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0;align-items:center;}
    .stat-panel{background:#fff;padding:20px;border-radius:12px;box-shadow:0 1px 8px #0000000a;margin-bottom:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:16px;}
    .stat-item h4{font-size:14px;color:#6b7280;margin-bottom:4px;}
    .stat-item p{font-size:24px;font-weight:bold;color:#1f2937;}
    .survey-list{display:grid;gap:12px;margin-top:20px;}
    .survey-card{background:#fff;padding:18px;border-radius:10px;box-shadow:0 1px 6px #00000008;}
    .card-head{display:flex;justify-content:space-between;margin-bottom:8px;align-items:center;}
    .score-badge{background:#fef3c7;color:#b45309;padding:2px 10px;border-radius:20px;font-size:14px;}
    .time{font-size:13px;color:#6b7280;}
    .cmt-box{background:#f9fafb;padding:12px;border-radius:8px;margin:10px 0;min-height:50px;white-space:pre-wrap;}
    .empty{text-align:center;padding:40px;color:#9ca3af;}
  </style>
</head>
<body>
<div class="wrap">
  <h1>Survey Admin</h1>
  <div class="sub-h">客户调研管理｜维护客户名单，生成调研邀请邮件</div>

  <div class="two-col">
    <!--客户列表模块-->
    <div class="panel">
      <h3>Customer List 客户清单</h3>
      <div class="input-row">
        <input id="custName" placeholder="Customer Name">
        <input id="custEmail" placeholder="Email">
        <input id="custTicket" placeholder="Ticket ID">
        <button class="btn-blue" id="addCustomer">Add</button>
      </div>
      <div id="custListWrap"></div>
      <div class="input-row" style="margin-top:12px;">
        <button class="btn-green" id="genMailBtn">Generate Selected Email HTML</button>
        <button class="btn-red" id="clearCust">Clear All Customer</button>
      </div>
    </div>

    <!--生成邮件预览源码-->
    <div class="panel">
      <h3>Generated Email HTML（复制全部粘贴到Outlook发送）</h3>
      <textarea class="code-block" id="mailOutput" readonly placeholder="勾选客户后点击Generate按钮生成邮件源码"></textarea>
    </div>
  </div>

  <!--调研数据统计与列表-->
  <div class="bar">
    <select id="filterScore">
      <option value="">All Stars</option>
      <option value="5">5 Star</option>
      <option value="4">4 Star</option>
      <option value="3">3 Star</option>
      <option value="2">2 Star</option>
      <option value="1">1 Star</option>
    </select>
    <button id="refreshBtn">Refresh Survey Data</button>
    <button id="clearAllSurvey" class="btn-red">Clear All Survey</button>
  </div>

  <div class="stat-panel" id="statPanel"></div>
  <div class="survey-list" id="listWrap"></div>
</div>

<script>
// storage key
const surveyKey = 'sevSurveyList';
const custKey = 'sevSurveyCustomerList';

// dom
const custNameEl = document.getElementById('custName');
const custEmailEl = document.getElementById('custEmail');
const custTicketEl = document.getElementById('custTicket');
const addCustBtn = document.getElementById('addCustomer');
const custListWrap = document.getElementById('custListWrap');
const genMailBtn = document.getElementById('genMailBtn');
const mailOutput = document.getElementById('mailOutput');
const clearCustBtn = document.getElementById('clearCust');

const filterEl = document.getElementById('filterScore');
const refreshBtn = document.getElementById('refreshBtn');
const clearSurveyBtn = document.getElementById('clearAllSurvey');
const statPanel = document.getElementById('statPanel');
const listWrap = document.getElementById('listWrap');

// customer
function getCustomerList(){
  return JSON.parse(localStorage.getItem(custKey)) || [];
}
function saveCustomerList(arr){
  localStorage.setItem(custKey, JSON.stringify(arr));
}

function renderCustomer(){
  const list = getCustomerList();
  custListWrap.innerHTML = list.map((item,idx)=>`
  <div class="customer-item">
    <input type="checkbox" class="cust-checkbox" data-index="${idx}">
    <span>${item.name}</span> |
    <span>${item.email}</span> |
    <span>Ticket:${item.ticketId||'-'}</span>
    <button data-index="${idx}" class="btn-red del‑cust">X</button>
  </div>
  `).join('');

  //del
  document.querySelectorAll('.del‑cust').forEach(btn=>{
    btn.onclick=()=>{
      const i = Number(btn.dataset.index);
      const arr = getCustomerList();
      arr.splice(i,1);
      saveCustomerList(arr);
      renderCustomer();
    }
  })
}

addCustBtn.onclick = ()=>{
  const name = custNameEl.value.trim();
  const email = custEmailEl.value.trim();
  const ticket = custTicketEl.value.trim();
  if(!name||!email){alert('Name & Email required');return;}
  const arr = getCustomerList();
  arr.push({id:Date.now(),name,email,ticketId:ticket});
  saveCustomerList(arr);
  custNameEl.value='';custEmailEl.value='';custTicketEl.value='';
  renderCustomer();
}

clearCustBtn.onclick=()=>{
  if(confirm('Clear all customer list?')){
    localStorage.removeItem(custKey);renderCustomer();
  }
}

// generate email template (copy from survey‑invite‑email.html)
genMailBtn.onclick = ()=>{
  const checkboxes = document.querySelectorAll('.cust-checkbox:checked');
  if(checkboxes.length===0){alert('Please select at least one customer');return;}
  //输出邮件HTML模板
  const emailHtml = `<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS Service Survey Invitation</title>
<style media="all" type="text/css">
@media all {.btn-primary table td:hover{background-color:#0658ce !important;}.btn-primary a:hover{background-color:#0658ce !important;border-color:#0658ce !important;}}
@media only screen and (max-width:640px){.main p,.main td,.main span{font-size:16px !important;}.wrapper{padding:8px !important;}.content{padding:0 !important;}.container{padding:0 !important;padding-top:8px !important;width:100% !important;}.main{border-left-width:0 !important;border-radius:0 !important;border-right-width:0 !important;}.btn table{max-width:100% !important;width:100% !important;}.btn a{font-size:16px !important;max-width:100% !important;width:100% !important;}}
@media all{.ExternalClass{width:100%;}.ExternalClass,.ExternalClass p,.ExternalClass span,.ExternalClass font,.ExternalClass td,.ExternalClass div{line-height:100%;}.apple-link a{color:inherit !important;font-family:inherit !important;font-size:inherit !important;font-weight:inherit !important;line-height:inherit !important;text-decoration:none !important;}#MessageViewBody a{color:inherit;text-decoration:none;font-size:inherit;font-family:inherit;font-weight:inherit;line-height:inherit;}}
</style>
</head>
<body style="font-family:Helvetica,sans-serif;-webkit-font-smoothing:antialiased;font-size:16px;line-height:1.3;-ms-text-size-adjust:100%;-webkit-text-size-adjust:100%;background-color:#f4f5f6;margin:0;padding:0;">
<table role="presentation" border="0" cellpadding="0" cellspacing="0" style="border-collapse:separate;mso-table-lspace:0pt;mso-table-rspace:0pt;background-color:#f4f5f6;width:100%;">
<tr>
<td style="font-family:Helvetica,sans-serif;font-size:16px;vertical-align:top;">&nbsp;</td>
<td style="font-family:Helvetica,sans-serif;font-size:16px;vertical-align:top;max-width:600px;padding:0;padding-top:24px;width:600px;margin:0 auto;">
<div style="box-sizing:border-box;display:block;margin:0 auto;max-width:600px;padding:0;">
<span style="display:none;height:0;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;visibility:hidden;width:0;">Please take 1 minute to complete our customer service survey.</span>
<table role="presentation" border="0" cellpadding="0" cellspacing="0" style="border-collapse:separate;mso-table-lspace:0pt;mso-table-rspace:0pt;background:#ffffff;border:1px solid #eaebed;border-radius:16px;width:100%;">
<tr>
<td style="font-family:Helvetica,sans-serif;font-size:16px;vertical-align:top;box-sizing:border-box;padding:24px;">
<p style="font-family:Helvetica,sans-serif;font-size:16px;font-weight:normal;margin:0 0 16px 0;">Dear Customer,</p>
<p style="font-family:Helvetica,sans-serif;font-size:16px;font-weight:normal;margin:0 0 16px 0;">Thank you for your recent customer‑service support experience. We would appreciate your feedback to help us continuously improve our service quality.</p>
<p style="font-family:Helvetica,sans-serif;font-size:16px;font-weight:normal;margin:0 0 16px 0;">Please take about 1 minute to complete our short survey.</p>
<table role="presentation" border="0" cellpadding="0" cellspacing="0" style="border-collapse:separate;mso-table-lspace:0pt;mso-table-rspace:0pt;width:100%;">
<tbody><tr><td align="left" style="padding-bottom:16px;">
<table role="presentation" border="0" cellpadding="0" cellspacing="0">
<tbody><tr><td align="center" bgcolor="#0867ec" style="border-radius:4px;background-color:#0867ec;">
<a href="https://cindy00f.github.io/open-report/cindy-report/sev‑survey.html" target="_blank" style="display:inline-block;padding:12px 24px;border:solid 2px #0867ec;border-radius:4px;background-color:#0867ec;color:#ffffff;font-size:16px;font-weight:bold;text-decoration:none;">Complete Survey</a>
</td></tr></tbody>
</table>
</td></tr></tbody>
</table>
<p style="font-family:Helvetica,sans-serif;font-size:16px;font-weight:normal;margin:0 0 16px 0;">Your opinion is very valuable to us.</p>
<p style="font-family:Helvetica,sans-serif;font-size:16px;font-weight:normal;margin:0 0 16px 0;">Best regards,<br>Customer Service Team</p>
</td></tr>
</table>
<div style="clear:both;padding-top:24px;text-align:center;width:100%;">
<table role="presentation" border="0" cellpadding="0" cellspacing="0" style="width:100%;">
<tr><td style="color:#9a9ea6;font-size:14px;text-align:center;">Philips Customer Service</td></tr>
</table>
</div>
</div>
</td><td>&nbsp;</td></tr>
</table>
</body></html>`;
  mailOutput.value = emailHtml;
  mailOutput.select();
  document.execCommand('copy');
  alert('HTML copied! Paste into Outlook to send email');
}

// survey render
function getSurveyRaw(){
  return JSON.parse(localStorage.getItem(surveyKey)) || [];
}
function renderSurvey(){
  const all = getSurveyRaw();
  let data = [...all];
  const filterVal = filterEl.value;
  if(filterVal) data = data.filter(d=>d.score===Number(filterVal));

  const total = all.length;
  const avg = total>0 ? (all.reduce((s,i)=>s+i.score,0)/total).toFixed(2) : '0.00';
  const star5 = all.filter(i=>i.score===5).length;
  const star4 = all.filter(i=>i.score===4).length;

  statPanel.innerHTML = `
    <div class="stat-item"><h4>Total Surveys</h4><p>${total}</p></div>
    <div class="stat-item"><h4>Avg Score</h4><p>${avg}</p></div>
    <div class="stat-item"><h4>5 Star</h4><p>${star5}</p></div>
    <div class="stat-item"><h4>4 Star</h4><p>${star4}</p></div>
  `;

  if(data.length===0){
    listWrap.innerHTML = `<div class="empty">No survey data available</div>`;
    return;
  }
  listWrap.innerHTML = data.map(item=>`
  <div class="survey-card">
    <div class="card-head">
      <span class="score-badge">${item.score} ★</span>
      <span class="time">${item.createTime}</span>
    </div>
    <div class="cmt-box">${item.comment || 'No comment'}</div>
  </div>`).join('');
}

refreshBtn.onclick = renderSurvey;
clearSurveyBtn.onclick = ()=>{
  if(confirm('Clear all survey data? Cannot undo!')){
    localStorage.removeItem(surveyKey);renderSurvey();
  }
}
filterEl.addEventListener('change',renderSurvey);

// init
renderCustomer();
renderSurvey();
</script>
</body>
</html>
