<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CS Service Satisfaction Evaluation｜客服服务满意度评价</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, sans-serif;
    }
    body {
      background: #f5f7fa;
      padding: 40px 20px;
    }
    .container {
      max-width: 520px;
      margin: 0 auto;
      background: #fff;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    h2 {
      text-align: center;
      color: #1f2937;
      margin-bottom:8px;
    }
    .sub-title{
      text-align:center;
      color:#6b7280;
      margin-bottom:24px;
    }
    .star-box {
      text-align: center;
      margin: 20px 0;
    }
    .star {
      font-size: 44px;
      color: #d1d5db;
      cursor: pointer;
      transition: color 0.2s;
      margin: 0 4px;
    }
    .star.active, .star:hover {
      color: #f59e0b;
    }
    .star-tip{
      text-align:center;
      color:#6b7280;
      font-size:14px;
      margin-bottom:16px;
    }
    textarea {
      width: 100%;
      height: 130px;
      padding: 14px;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      font-size: 15px;
      resize: none;
      margin: 8px 0 20px;
    }
    textarea:focus {
      outline: none;
      border-color: #2563eb;
    }
    .submit-btn {
      width: 100%;
      padding: 14px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .submit-btn:hover {
      background: #1d4ed8;
    }
    .modal-wrap {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      align-items: center;
      justify-content: center;
    }
    .modal-card{
      background:#fff;
      padding:36px 28px;
      border-radius:12px;
      text-align:center;
      max-width:360px;
    }
    .modal-card h3{
      color:#059669;
      margin-bottom:12px;
    }
    .modal-close{
      margin-top:14px;
      padding:8px 22px;
      border:none;
      background:#2563eb;
      color:#fff;
      border-radius:6px;
      cursor:pointer;
    }
  </style>
</head>
<body>
<div class="container">
  <h2>客服服务满意度评价</h2>
  <div class="sub-title">CS Service Satisfaction Evaluation</div>
  <div class="star-box">
    <span class="star" data-score="1">★</span>
    <span class="star" data-score="2">★</span>
    <span class="star" data-score="3">★</span>
    <span class="star" data-score="4">★</span>
    <span class="star" data-score="5">★</span>
  </div>
  <div class="star-tip">请对本次客服服务进行打分（1‑5星）</div>
  <textarea id="evalComment" placeholder="可选：请留下您的意见或建议"></textarea>
  <button class="submit-btn" id="submitEval">提交评价</button>
</div>

<div class="modal-wrap" id="successModal">
  <div class="modal-card">
    <h3>感谢您的评价！Thank you!</h3>
    <p>您的反馈对我们非常重要</p>
    <button class="modal-close" id="modalOk">确定</button>
  </div>
</div>

<script>
  let selectedScore = 0;
  const stars = document.querySelectorAll('.star');
  const commentEl = document.getElementById('evalComment');
  const submitBtn = document.getElementById('submitEval');
  const modal = document.getElementById('successModal');
  const modalOk = document.getElementById('modalOk');

  stars.forEach(s=>{
    s.addEventListener('click',()=>{
      selectedScore = Number(s.dataset.score);
      stars.forEach(x=>x.classList.remove('active'));
      for(let i=0;i<selectedScore;i++) stars[i].classList.add('active');
    })
  })

  submitBtn.addEventListener('click',()=>{
    if(selectedScore===0){
      alert("请先选择服务星级评价");
      return;
    }
    const payload = {
      id: Date.now(),
      score: selectedScore,
      comment: commentEl.value.trim(),
      createTime: new Date().toLocaleString()
    }
    let list = JSON.parse(localStorage.getItem('csEvalList')) || [];
    list.unshift(payload);
    localStorage.setItem('csEvalList',JSON.stringify(list));

    modal.style.display = 'flex';
    // reset
    selectedScore=0;
    stars.forEach(x=>x.classList.remove('active'));
    commentEl.value='';
  })
  modalOk.addEventListener('click',()=>modal.style.display='none');
</script>
</body>
</html>
