<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Service Survey</title>
<style>
*{box-sizing:border-box;font-family:Helvetica,sans-serif;}
body{background:#f3f4f6;padding:24px;margin:0;}
.container{max-width:600px;margin:0 auto;background:#fff;padding:32px;border-radius:16px;box-shadow:0 1px 10px #00000012;}
h2{color:#1f2937;margin-top:0;}
.star-wrap{margin:24px 0;}
.star{font-size:42px;color:#d1d5db;cursor:pointer;margin:0 4px;display:inline-block;}
.star.active{color:#f59e0b;}
textarea{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:8px;font-size:16px;min-height:120px;margin:12px 0;}
button{padding:12px 24px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer;}
.tip{color:#6b7280;font-size:14px;}
.success{color:#059669;margin-top:16px;}
</style>
</head>
<body>
<div class="container">
  <h2>Personal Service Feedback Survey</h2>
  <p class="tip">Ticket ID: <span id="ticketDisplay">-</span></p>
  <div class="star-wrap">
    <span class="star" data-val="1">★</span>
    <span class="star" data-val="2">★</span>
    <span class="star" data-val="3">★</span>
    <span class="star" data-val="4">★</span>
    <span class="star" data-val="5">★</span>
  </div>
  <textarea id="comment" placeholder="Please leave your comments and suggestions..."></textarea>
  <br>
  <button id="submitBtn">Submit Feedback</button>
  <div id="msg" class="success"></div>
</div>

<script>
// 兼容读取URL ticket参数，修复带参数打不开问题
const urlParams = new URLSearchParams(window.location.search);
const ticketId = urlParams.get('ticket') || "";
document.getElementById('ticketDisplay').textContent = ticketId || "Not specified";

let selectScore = 0;
const stars = document.querySelectorAll('.star');
stars.forEach(s=>{
  s.onclick = ()=>{
    selectScore = Number(s.dataset.val);
    stars.forEach(x=>x.classList.remove('active'));
    for(let i=0;i<selectScore;i++) stars[i].classList.add('active');
  }
})

document.getElementById('submitBtn').onclick = ()=>{
  const msgBox = document.getElementById('msg');
  if(!selectScore){
    msgBox.innerText = "Please select star rating first";
    msgBox.style.color = "#dc2626";
    return;
  }
  const comment = document.getElementById('comment').value.trim();
  const surveyKey = "sevSurveyList";
  const list = JSON.parse(localStorage.getItem(surveyKey)||"[]");
  list.unshift({
    id: Date.now(),
    ticketId: ticketId,
    score: selectScore,
    comment: comment,
    createTime: new Date().toLocaleString()
  })
  localStorage.setItem(surveyKey, JSON.stringify(list));
  msgBox.innerText = "✅ Thank you! Your feedback has been submitted successfully.";
  msgBox.style.color = "#059669";
  // 重置表单
  selectScore = 0;
  stars.forEach(x=>x.classList.remove('active'));
  document.getElementById('comment').value = "";
}
</script>
</body>
</html>
