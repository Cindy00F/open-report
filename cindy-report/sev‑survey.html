<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Service Survey</title>
<style>
*{box-sizing:border-box;font-family:Helvetica,sans-serif;}
body{background:#f3f4f6;padding:24px;margin:0;}
.container{max-width:600px;margin:0 auto;background:#fff;padding:32px;border-radius:16px;box-shadow:0 1px 10px rgba(0,0,0,0.12);}
h2{color:#1f2937;margin-top:0;}
.star-wrap{margin:24px 0;}
.star{font-size:42px;color:#d1d5db;cursor:pointer;margin:0 4px;display:inline-block;user-select:none;}
.star.active{color:#f59e0b;}
textarea{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:8px;font-size:16px;min-height:120px;margin:12px 0;}
button{padding:12px 24px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer;}
.tip{color:#6b7280;font-size:14px;}
.msg{margin-top:16px;}
.msg.ok{color:#059669;}
.msg.err{color:#dc2626;}
</style>
</head>
<body>
<div class="container">
  <h2>Personal Service Feedback Survey</h2>
  <p class="tip">Ticket ID: <span id="ticketDisplay">-</span></p>

  <div class="star-wrap" id="starWrap">
    <span class="star" data-val="1">★</span>
    <span class="star" data-val="2">★</span>
    <span class="star" data-val="3">★</span>
    <span class="star" data-val="4">★</span>
    <span class="star" data-val="5">★</span>
  </div>

  <textarea id="comment" placeholder="Please leave your comments and suggestions..."></textarea>
  <br>
  <button id="submitBtn">Submit Feedback</button>
  <div id="msgBox" class="msg"></div>
</div>

<script>
// 正确读取URL ?ticket=xxx 参数
const urlParams = new URLSearchParams(window.location.search);
const ticketId = urlParams.get("ticket") ?? "";
document.getElementById("ticketDisplay").textContent = ticketId || "Not specified";

let selectedScore = 0;
const starList = document.querySelectorAll(".star");

// 星星点击逻辑
starList.forEach(star=>{
  star.addEventListener("click", ()=>{
    selectedScore = Number(star.dataset.val);
    //点亮前面所有星星
    starList.forEach((s,idx)=>{
      if(idx < selectedScore){
        s.classList.add("active");
      }else{
        s.classList.remove("active");
      }
    })
  })
})

//提交
document.getElementById("submitBtn").addEventListener("click",()=>{
  const msgBox = document.getElementById("msgBox");
  const commentVal = document.getElementById("comment").value.trim();
  if(selectedScore === 0){
    msgBox.className = "msg err";
    msgBox.innerText = "Please select star rating first.";
    return;
  }

  //写入localStorage，和admin页面共用存储key
  const storageKey = "sevSurveyList";
  let arr = JSON.parse(localStorage.getItem(storageKey) || "[]");
  arr.unshift({
    id: Date.now(),
    ticketId: ticketId,
    score: selectedScore,
    comment: commentVal,
    createTime: new Date().toLocaleString()
  });
  localStorage.setItem(storageKey, JSON.stringify(arr));

  //成功提示 +重置表单
  msgBox.className = "msg ok";
  msgBox.innerText = "✅ Thank you! Feedback submitted successfully.";
  selectedScore = 0;
  starList.forEach(s=>s.classList.remove("active"));
  document.getElementById("comment").value = "";
})
</script>
</body>
</html>
